{% extends 'base.html' %}
{% block title %}Quên mật khẩu · Đấu giá từ thiện{% endblock %}
{% block content %}
<div class="card auth-wrap">
  <h1>Quên mật khẩu</h1>
  <p class="muted">Nhập email đã đăng ký, hệ thống sẽ gửi cho bạn mật khẩu mới gồm 8 ký tự ngẫu nhiên.</p>
  <form method="post">
    <label>Email</label>
    <input type="email" name="email" required>
    <button class="btn btn-block" type="submit">Gửi mật khẩu mới</button>
  </form>
  <div class="links">
    <a href="{{ url_for('login') }}">Trở về trang đăng nhập</a>
  </div>
</div>
{% endblock %}
