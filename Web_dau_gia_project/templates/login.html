{% extends 'base.html' %}
{% block title %}Đăng nhập · Đấu giá từ thiện{% endblock %}
{% block content %}
<div class="card auth-wrap">
  <h1>Đăng nhập</h1>
  <form method="post">
    <label>Tên đăng nhập</label>
    <input type="text" name="username" required>
    <label>Mật mã</label>
    <input type="password" name="password" required>
    <button class="btn btn-block" type="submit">Đăng nhập</button>
  </form>
  <div class="links">
    <a href="{{ url_for('forget_password') }}">Quên mật khẩu?</a>
    &nbsp;·&nbsp;
    <a href="{{ url_for('register') }}">Đăng ký mới</a>
  </div>
</div>
{% endblock %}
